name: Package Windows release
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
concurrency:
  group: windows-release-${{ github.ref }}
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check release tag
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $version = python -c "import tomllib; from pathlib import Path; from colosseum_randomizer import __version__; assert tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'] == __version__; print(__version__)"
          if ($LASTEXITCODE -ne 0 -or $env:GITHUB_REF_NAME -ne "v$version") {
            throw 'The tag must match the application version.'
          }
      - run: python -m pip install -r requirements-build.txt
      - run: python -m pip install --no-deps -e .
      - run: python scripts/build_native.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/fetch_qt_notices.py
      - run: python scripts/build_desktop.py --edition public
      - run: python scripts/smoke_desktop.py --edition public --report build/public-windows-smoke.json
      - uses: actions/upload-artifact@v7
        with:
          name: orre-randomizer-windows
          if-no-files-found: error
          compression-level: 0
          path: |
            dist/public/*.zip
            dist/public/SHA256SUMS.json
      - uses: actions/upload-artifact@v7
        with:
          name: orre-randomizer-verification
          if-no-files-found: error
          path: |
            build/desktop-release-public-audit.json
            build/public-windows-smoke.json
  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: orre-randomizer-windows
          path: release-assets
      - name: Publish Windows and source archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/*.zip release-assets/SHA256SUMS.json \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            --title "Pokémon Orre Randomizer $GITHUB_REF_NAME"
