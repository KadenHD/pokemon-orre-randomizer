name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Qt runtime libraries on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1
      - run: python -m pip install -c requirements-build.txt -e .
      - name: Check that Qt can start offscreen
        run: python -c "from PySide6.QtWidgets import QApplication; app = QApplication([])"
      - run: python scripts/build_native.py
      - run: python -X utf8 scripts/run_tests.py
      - run: python scripts/build_desktop.py --edition public --source-only
      - run: python scripts/verify_release.py --edition public
