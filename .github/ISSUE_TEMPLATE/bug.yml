name: Report a bug
description: A problem with the app or a generated game.
body:
  - type: markdown
    attributes:
      value: "Leave ROMs and save files out of the report. Remove local paths and personal information from any excerpts you share."
  - type: input
    id: version
    attributes:
      label: App version and Windows version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: "Describe what you expected and what happened. In either game's Profiles menu, Export diagnostic lets you review and save the failed attempt's settings and an optional seed. You can attach that JSON file here."
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Error message or report excerpts
      description: "Prefer the reviewed JSON from Profiles > Export diagnostic. It excludes ROMs, saves, local paths and raw logs. Review any additional error excerpts before sharing them."
