name: Report a bug
description: A problem with the app or a generated game.
body:
  - type: markdown
    attributes:
      value: "Leave ROMs and save files out of the report. Remove local paths and personal information from any excerpts you share."
  - type: input
    id: version
    attributes:
      label: App version and Windows version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: "Include the seed, settings or JSON profile. Describe what you expected and what happened."
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Error message or report excerpts
      description: "Include the engine version and relevant hashes. Review the content before sharing it."
