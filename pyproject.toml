[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pokemon-orre-randomizer"
version = "2.1.5"
description = "Offline randomizer for Pokémon Colosseum and Pokémon XD"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Pokémon Orre Randomizer contributors"}]
dependencies = ["PySide6-Essentials>=6.8,<7", "Pillow>=13,<14"]

[project.optional-dependencies]
build = ["pyinstaller>=6.11,<7"]
artwork = ["numpy==2.2.6"]

[project.gui-scripts]
orre-randomizer = "orre_randomizer.gui:main"
colosseum-randomizer = "orre_randomizer.gui:main"

[project.scripts]
orre-randomizer-cli = "orre_randomizer.cli:main"
colosseum-randomizer-cli = "orre_randomizer.cli:main"

[tool.setuptools.packages.find]
include = ["orre_randomizer*"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
orre_randomizer = ["windows_update.ps1", "_native/*.dll", "_native/*.json", "_native/OrreLauncher.exe", "_native/*.so", "_native/*.dylib", "_native/OrreLauncher", "assets/app/*.ico", "assets/app/*.png", "assets/app/*.json", "assets/app/*.md", "assets/game/*/*.png", "assets/game/*/*.wav", "assets/game/*/*.json", "assets/game/models/dark-lugia-colosseum-v1.pkx", "assets/game/models/extra-portraits/*.png", "assets/game/models/extra-portraits/*.json", "assets/game/models/deoxys/*.png", "assets/game/models/deoxys/*.pkx", "assets/game/models/deoxys/*.json", "assets/game/fonts/*.ttf", "assets/game/fonts/*.txt", "assets/game/*.json", "assets/game/*.md", "assets/rules/fairy/*.json", "assets/rules/fairy/*.txt", "assets/rules/fairy/*.md"]


