[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pokemon-orre-randomizer"
version = "1.0.0"
description = "Offline randomizer for Pokémon Colosseum and Pokémon XD"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Pokémon Orre Randomizer contributors"}]
dependencies = ["PySide6-Essentials>=6.8,<7"]

[project.optional-dependencies]
build = ["pyinstaller>=6.11,<7"]

[project.gui-scripts]
orre-randomizer = "orre_randomizer.gui:main"
colosseum-randomizer = "orre_randomizer.gui:main"

[project.scripts]
orre-randomizer-cli = "orre_randomizer.cli:main"
colosseum-randomizer-cli = "orre_randomizer.cli:main"

[tool.setuptools.packages.find]
include = ["orre_randomizer*"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
orre_randomizer = ["assets/app/*.ico", "assets/app/*.png", "assets/app/*.json", "assets/app/*.md", "assets/game/*/*.png", "assets/game/*/*.wav", "assets/game/*/*.json", "assets/game/*.json", "assets/game/*.md"]


